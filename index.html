<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/png" href="/icone_header.png" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link
         rel="preload"
         as="font"
         href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
         type="font/woff2"
         crossorigin
      />
      <script>
         if ((location.pathname === "/" || location.pathname.endsWith("/catalogo")) && !location.search) {
            const image = document.createElement("link");
            image.rel = "preload";
            image.as = "image";
            image.href = "/images/cursos/administracao-640.webp";
            image.imageSrcset =
               "/images/cursos/administracao-320.webp 320w, /images/cursos/administracao-640.webp 640w" +
               (matchMedia("(min-width: 641px)").matches ? ", /images/cursos/administracao-1280.webp 1000w" : "");
            image.imageSizes = "(max-width: 640px) calc(100vw - 32px), (max-width: 1024px) 45vw, 30vw";
            image.fetchPriority = "high";
            document.head.append(image);
         }
      </script>
      <meta name="description" content="Catálogo interno de campanhas e ofertas do Grupo Anchieta. Demonstração com dados fictícios." />
      <meta name="robots" content="noindex, nofollow" />
      <title>Campanhas e Ofertas | Grupo Anchieta</title>
   </head>
   <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
